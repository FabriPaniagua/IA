services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - UPDATE_INTERVAL_SECONDS=21600
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
